<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test task</title>

    <style>
        #player {
            width: 50px;
            height: 50px;
            border-radius: 100%;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="attachBtn">Attach</button>
        <button id="detachBtn">Detach</button>
        <button id="enableBtn">Enable</button>
        <button id="disableBtn">Disable</button>
        <button id="bindJumpBtn">Jump</button>
    </div>
    <div class="status">
        <p>Включен контроллер?: <span id="enabledStatus">Нет</span></p>
        <p>Окно в фокусе?: <span id="focusedStatus">Нет</span></p>
    </div>

    <div id="player"></div>

    <script src="./js/input-controller.js"></script>
    <script src="./js/input-controller-test.js"></script>
</body>
</html>
